# Local dev database only — production MySQL lives in Hostinger hPanel.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ftse
      MYSQL_USER: ftse
      MYSQL_PASSWORD: ftse
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
